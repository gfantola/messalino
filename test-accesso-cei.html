<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test accesso diretto CEI</title><style>body{font:17px system-ui;background:#f6f3eb;color:#302c25;margin:24px auto;padding:0 16px;max-width:760px}iframe{width:100%;height:65vh;border:1px solid #bbb;border-radius:8px}button,input{font:inherit;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Accesso diretto alla liturgia</h1><a href="./">Torna al Messalino</a><p>Prova di accesso alla fonte originale dal browser, senza archiviare testi.</p><input type="date" id="day"><button id="go">Verifica</button><pre id="status" role="status"></pre><p><a id="source" target="_blank" rel="noopener">Apri la fonte CEI</a></p><iframe id="frame" title="Pagina originale CEI" referrerpolicy="no-referrer"></iframe><script>const d=document.getElementById('day'),status=document.getElementById('status');const n=new Date();d.value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');let seq=0;async function run(){const token=++seq;const url='https://www.chiesacattolica.it/liturgia-del-giorno/?data-liturgia='+d.value.replace(/-/g,'');document.getElementById('source').href=url;document.getElementById('frame').src=url;status.textContent='Verifica accesso diretto…';try{const r=await fetch(url,{credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const count=doc.querySelectorAll('.cci-liturgia-giorno-dettagli-content').length;if(token===seq)status.textContent='Accesso diretto riuscito. Contenitori rilevati: '+count+'. Nessun testo salvato.'}catch(e){if(token===seq)status.textContent='Accesso diretto non riuscito: '+e.message+'. Verifica se la pagina originale appare nel riquadro sottostante.'}}document.getElementById('go').onclick=run;d.onchange=run;run();</script></html>
