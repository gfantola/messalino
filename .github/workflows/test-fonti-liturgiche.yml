name: Test fonti liturgiche
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Analizza fonti senza salvare testi
        run: python3 tools/probe_liturgy.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verifica struttura CEI e riferimenti biblici
        run: |
          set -o pipefail
          python3 -m py_compile tools/probe_cei_structure.py
          python3 tools/probe_cei_structure.py | tee -a "$GITHUB_STEP_SUMMARY"
