name: Aggiorna riferimenti CEI
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Crea indice giornaliero
        run: python3 tools/build_cei_index.py
      - name: Salva riferimenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/cei ]; then
            git add data/cei
            if ! git diff --cached --quiet; then
              git commit -m "Update CEI reference index"
              git push
            fi
          else
            exit 1
          fi
